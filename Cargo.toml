[package]
name = "phenotypes"
version = "0.1.3-dev0"
description = "Common types and traits for modeling clinical information"
keywords = ["phenomics", "bioinformatics", "HPO", "phenopackets"]
edition = "2024"

homepage = "https://github.com/P2GX/phenotypes"
repository = "https://github.com/P2GX/phenotypes"
readme = "README.md"
license-file = "LICENSE"

authors = ["Daniel Danis <daniel.gordon.danis@protonmail.com>"]

[badges]
maintenance = { status = "experimental" }

[dependencies]
# ontolius = { version = "0.8.0", default-features = false }
ontolius = { git = "https://github.com/ielis/ontolius.git", branch="development",  default-features = false }

[[example]]
name = "observable-features"
crate-type = ["staticlib"]
test = true
